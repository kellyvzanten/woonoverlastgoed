*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(circle at 50% 0,var(--bg),var(--bg2));color:#fff8e7;font:17px/1.45 Georgia,serif;min-height:100vh;padding:0 16px 24px;overflow-x:hidden}
.lights{display:flex;justify-content:space-around;margin:0 -16px 14px;padding-top:6px;border-top:3px solid #0006}
.lights i{width:14px;height:20px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;animation:bl 1.6s infinite}
.lights i:nth-child(4n+1){background:#e74c3c}.lights i:nth-child(4n+2){background:var(--gold);animation-delay:.4s}.lights i:nth-child(4n+3){background:#3cc46a;animation-delay:.8s}.lights i:nth-child(4n){background:#4aa3e8;animation-delay:1.2s}

.sub{margin:2px 0 16px;color:#d9ceb3}
#snow{position:fixed;inset:0;pointer-events:none;z-index:1}
#snow span{position:absolute;top:-20px;color:#fff;opacity:.8;animation:fall linear infinite}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(360deg)}}
.game{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:760px){.game{grid-template-columns:1fr}}
.board{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:3px;aspect-ratio:681/626;background:var(--gold);border:4px solid var(--gold);border-radius:8px;overflow:hidden;box-shadow:0 8px 30px #0008;transition:gap .8s}
.slot{background:var(--bg2);display:grid;place-items:center;font-size:26px;opacity:.9}
.board.ghost .slot:not(.on){background-image:linear-gradient(#0a231bd9,#0a231bd9),var(--img);background-size:auto,300% 400%}
.slot.hot{cursor:pointer}.slot.hot:hover{outline:3px dashed var(--gold);outline-offset:-3px}
.slot.on{background-image:var(--img);background-size:300% 400%;opacity:1}
.slot.new{animation:pop .9s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(0) rotate(-30deg)}100%{transform:none}}
.board.full{gap:0;animation:glow 2s infinite alternate}
@keyframes glow{to{box-shadow:0 0 40px var(--gold)}}
.panel{background:var(--surf);color:var(--ink);border-radius:12px;padding:18px;border:4px solid var(--red);box-shadow:0 8px 30px #0008}
.kind{color:#7a6a55;font-size:15px;margin:0}
.bar{height:8px;background:#e3d5b5;border-radius:9px;margin:8px 0 14px;overflow:hidden}.bar b{display:block;height:100%;background:var(--red);transition:width .6s}
.q{font-size:20px;margin:0 0 14px}
button{font:inherit;display:block;width:100%;text-align:left;padding:11px 14px;border-radius:9px;border:2px solid var(--red);background:#fff;color:var(--ink);cursor:pointer;margin:0 0 9px}
button:hover{background:#fde9e5}
button.go{background:var(--red);color:#fff;text-align:center;width:auto;display:inline-block;margin:6px 8px 0 0}
button.snd{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));width:auto;z-index:5;border-radius:99px;border-color:var(--gold);background:#0008;color:#fff;padding:6px 12px}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.big{font-size:84px;text-align:center;line-height:1;animation:shk 1s ease-in-out 2}
.hands{animation:clap 1.2s ease-in-out infinite}
@keyframes clap{0%,100%{transform:scale(1) rotate(-6deg)}50%{transform:scale(1.25) rotate(6deg)}}
.angry{width:150px;aspect-ratio:1;margin:0 auto 10px;border-radius:50%;background-image:var(--img);background-size:425.6% auto;background-position:35.5% 17.2%;border:4px solid var(--red);animation:shk .5s 2}
@keyframes shk{20%{transform:translateX(-8px) rotate(-3deg)}60%{transform:translateX(8px) rotate(3deg)}}
.msg{text-align:center;font-size:19px;margin:6px 0 10px}.ex{margin:0 0 12px}
.fin{max-width:520px}.fin h2{font:700 30px 'Mountains of Christmas',Georgia,serif;color:var(--red);margin:0 0 6px}
.hearth{background:linear-gradient(#1a0f08,#3b1f10);border-radius:10px;padding:6px 10px 10px;margin:10px 0 12px;text-align:center;border:2px solid #7a4a22}
.fire{position:relative;height:84px;width:130px;margin:0 auto}
.fl{position:absolute;bottom:14px;width:34px;height:56px;border-radius:50% 50% 50% 50%/70% 70% 30% 30%;background:radial-gradient(circle at 50% 80%,#fff3a0,#ffb02e 45%,#e8431a 80%);transform-origin:50% 100%;animation:flk .45s ease-in-out infinite alternate;filter:blur(1px)}
.fl:nth-child(1){left:10px;height:44px}.fl:nth-child(2){left:32px;height:66px;animation-delay:-.2s}.fl:nth-child(3){left:54px;height:58px;animation-delay:-.1s}.fl:nth-child(4){left:76px;height:46px;animation-delay:-.3s}
@keyframes flk{0%{transform:scaleY(.85) skewX(-6deg)}100%{transform:scaleY(1.1) skewX(6deg);opacity:.9}}
.lg{position:absolute;bottom:4px;left:14px;width:102px;height:14px;background:#5a3418;border-radius:8px}.lg.b{transform:rotate(-6deg);bottom:10px;background:#6b4020}
.sp{position:absolute;bottom:40px;width:4px;height:4px;border-radius:50%;background:#ffd45a;animation:spk 1.4s linear infinite}
.sp:nth-of-type(1){left:40px}.sp:nth-of-type(2){left:70px;animation-delay:-.5s}.sp:nth-of-type(3){left:55px;animation-delay:-.9s}
@keyframes spk{to{transform:translate(12px,-60px);opacity:0}}
.fireq{font:700 21px 'Mountains of Christmas',Georgia,serif;color:var(--gold);margin:4px 0 0}
h1{background:linear-gradient(90deg,#f0c24b,#fff,#e74c3c,#f0c24b);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 2px 6px #000a);animation:shm 4s linear infinite}
@keyframes shm{to{background-position:300% 0}}
.lights i{box-shadow:0 0 14px 3px #fff5;animation-duration:.9s}
.panel{animation:bc 2.4s ease-in-out infinite}@keyframes bc{50%{border-color:var(--gold);box-shadow:0 0 28px #f0c24b88}}
.panel button{animation:sl .4s both}.panel button:nth-of-type(2){animation-delay:.08s}.panel button:nth-of-type(3){animation-delay:.16s}
@keyframes sl{from{opacity:0;transform:translateX(30px)}}
button:hover{transform:translateX(6px);background:#ffe4de}button.go:hover{transform:scale(1.06);background:#e0412f}

.fx{position:fixed;inset:0;pointer-events:none;z-index:9;overflow:hidden}
.fx i{position:absolute;width:9px;height:14px;animation:cf 2.2s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes cf{40%{transform:translate(calc(var(--dx)*.6),var(--dy)) rotate(calc(var(--r)*.5))}100%{transform:translate(var(--dx),110vh) rotate(var(--r))}}
.fx i.p{width:6px;height:6px;border-radius:50%;animation:fwk 1.1s ease-out forwards;box-shadow:0 0 8px currentColor}
@keyframes fwk{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.fx .flash{position:absolute;inset:0;animation:fl .7s ease-out forwards}@keyframes fl{0%{opacity:.7}100%{opacity:0}}

@keyframes dr{to{stroke-dashoffset:0}}
.tray{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:6px}
.cell{aspect-ratio:227/156.5;border:2px dashed #ffffff33;border-radius:6px}
.cell.pc{border:2px solid var(--gold);background-image:var(--img);background-size:300% 400%;cursor:pointer;box-shadow:0 2px 8px #0008}
.cell.pc.sel{outline:3px solid #fff;transform:scale(1.14);z-index:2;position:relative}.cell.new{animation:pop .9s}
.trayt{margin:10px 0 0;color:#d9ceb3;font-size:15px}

@keyframes blk{50%{opacity:.4;transform:scale(1.12)}}
.postcard{background:#fff8e7;color:var(--ink);border-radius:14px;padding:18px;text-align:center;border:4px solid var(--red);box-shadow:0 0 40px #f0c24b66;max-width:620px;margin:22px auto 0;animation:pcin 1s 1.6s both}

function newGame(){if(S){clearInterval(S.iv);clearTimeout(S.tk)}S={i:0,order:shuf([...Array(12).keys()]),earned:[],placed:new Set(),sel:null,fout:0,ph:'start',nw:null,lim:60000};draw()}
function stopT(){clearInterval(S.iv);clearTimeout(S.tk);if(mg)mg.gain.setTargetAtTime(mute?0:1,ac.currentTime,.3)}
function upd(){const rem=Math.max(0,S.lim-(performance.now()-S.t0)),e=$('#tm'),b=$('#tb');if(e){const c=Math.ceil(rem/1000);e.textContent=Math.floor(c/60)+':'+String(c%60).padStart(2,'0');e.classList.toggle('hot',rem<10000)}if(b)b.style.width=rem/S.lim*100+'%';if(rem<=0)lose()}
function tick(){if(S.ph!='build')return;const p=Math.min(1,(performance.now()-S.t0)/S.lim),iv=1000-860*Math.pow(p,1.3);S.n=(S.n||0)+1;tone(S.n%2?1000:700,0,.06,'square',.1);
 $('#vig').animate([{opacity:0},{opacity:.12+.5*p,offset:.15},{opacity:0}],{duration:Math.min(iv,700)});S.tk=setTimeout(tick,iv)}
function startBuild(){const s=S;s.ph='build';s.placed=new Set();s.sel=null;s.nw=null;s.t0=performance.now();if(mg)mg.gain.setTargetAtTime(mute?0:.2,ac.currentTime,.3);draw();s.iv=setInterval(upd,100);tick()}
function lose(){stopT();S.ph='lose';draw();setTimeout(throwSnow,80)}
function win(){stopT();S.ph='win';draw();song();setTimeout(finale,150)}
function draw(){
 const s=S,q=Q[s.i],bd=s.ph=='build',w=s.ph=='win',gh=['intro','build','lose'].includes(s.ph);let body='';
 if(s.ph=='start')body=`<h2 style="margin:0 0 6px">Luikje open!</h2><p class="ex">Beantwoord 12 vragen over de Aanpak Woonoverlast Vijfheerenlanden. Elk goed antwoord geeft een puzzelstukje. Zijn alle vragen goed? Dan leg je de puzzel in één minuut, terwijl de klok tikt. Bij een fout antwoord verschijnt de boze buurman…</p><button class="go" id="st">Start de puzzel 🎄</button>`;
 else if(s.ph=='ask')body=`<p class="kind">Vraag ${s.i+1} van 12</p><div class="bar"><b style="width:${s.i/12*100}%"></b></div><p class="q">${q.q}</p>${q.o.map((x,k)=>`<button data-k="${k}">${x}</button>`).join('')}`;
 else if(s.ph=='ok')body=`<div class="big hands">✨🤝✨</div><p class="msg"><b>${OK[s.i%4]}</b></p><p class="ex">${q.e}</p><p class="kind">🧩 Je hebt een puzzelstukje verdiend!</p>${FIRE}<button class="go" id="nx">${s.i==11?'Naar de puzzel ⏱':'Volgende vraag'}</button>`;
 else if(s.ph=='bad')body=`<div class="angry" role="img" aria-label="Boze buurman"></div><p class="msg"><b>${BAD[s.fout%4]}</b></p><p class="ex" style="text-align:center">Probeer het nog eens.</p>${FIRE}<button class="go" id="rt">Opnieuw proberen</button>`;
 else if(s.ph=='intro')body=`<h2 style="margin:0 0 6px">Alle 12 stukjes verdiend!</h2><p class="ex">Je hebt <b>1 minuut</b> om de puzzel te leggen. Klik eerst op een stukje en daarna op de plek op de puzzel. Let op: de tikker gaat steeds sneller…</p><button class="go" id="bgo">Start de klok ⏱</button>`;
 else if(bd)body=`<div class="clock"><span id="tm">1:00</span></div><div class="bar"><b id="tb" style="width:100%"></b></div><p class="kind">Klik een stukje en daarna de plek op de puzzel. ${s.placed.size} van 12 gelegd.</p>`;
 else if(s.ph=='lose')body=`<div class="angry" role="img" aria-label="Boze buurman"></div><p class="msg"><b>Tijd om! De buurman verliest zijn geduld…</b></p><p class="ex" style="text-align:center">Nog ${12-s.placed.size} stukjes te gaan. Nog een poging?</p><button class="go" id="bgo">Nog een minuut ⏱</button>`;
 else body=`<div class="fin"><h2>Gelukt! Vrede op aarde, zelfs tussen de buren</h2><p class="ex">Alleen moet er op dit plaatje nog wel wat voor gebeuren.${s.fout?` (De boze buurman kwam ${s.fout} keer langs onderweg.)`:''}</p><p class="ex">Wil je meer weten? Vraag ernaar bij Martien Bouter. Of lees de <i>Beleidsregels aanpak woonoverlast Vijfheerenlanden 2024</i> op Lokale wet- en regelgeving.</p><p class="ex"><b>En hou het een beetje gezellig met de buren, dan hebben wij minder werk!</b></p><p class="kind">Plaatje: schilderij van Marius van Dokkum.</p><button class="go" id="again">Nog een keer</button></div>`;
 const board=[...Array(12).keys()].map(p=>{const on=s.placed.has(p)||w;return`<div class="slot ${on?'on':''} ${bd&&!on?'hot':''}" data-i="${p}" style="${tile(p)}"></div>`}).join('');
 const tray=w?'':`<p class="trayt">Jouw puzzelstukjes: ${s.earned.length} van 12</p><div class="tray">${[...Array(12).keys()].map(k=>{const p=s.earned[k];if(p===undefined||s.placed.has(p))return'<div class="cell"></div>';return`<div class="cell pc ${s.sel===p?'sel':''} ${s.nw===p?'new':''}" data-p="${p}" style="${tile(p)}"${bd?' role="button" tabindex="0"':''}></div>`}).join('')}</div>`;
 const post=w?`<div class="postcard"><div class="pol">${FLOD?`<img src="${FLOD}" alt="De familie Flodder">`:'<div class="ph">👨‍👩‍👧‍👦<small>Hier komt de familiefoto</small></div>'}</div><h2>Fijne feestdagen uit Zonnedael</h2></div>`:'';
 app.innerHTML=`<div class="game"><div><div class="board ${w?'full':''} ${gh?'ghost':''}">${board}</div>${tray}</div><div class="panel">${body}</div></div>${post}`;
 const fc=$('.fc');if(fc)startFire(fc);else cancelAnimationFrame(fireRaf);
 const on=(id,f)=>{const e=$(id);if(e)e.onclick=f};
 on('#st',()=>{if(!ac)try{ac=new AudioContext()}catch(e){}startMusic();jingle();s.ph='ask';draw()});
 on('#nx',()=>{s.nw=null;if(s.i==11)s.ph='intro';else{s.i++;s.ph='ask'}draw()});
 on('#rt',()=>{s.ph='ask';draw()});on('#bgo',startBuild);on('#again',newGame);
 app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{
  if([].concat(q.c).includes(+b.dataset.k)){s.earned.push(s.order[s.i]);s.nw=s.order[s.i];s.ph='ok';jingle();crackle();confetti(80,60);flash('#f0c24bcc')}
  else{s.fout++;s.ph='bad';crackle();setTimeout(throwSnow,60)}draw()});
 if(bd){
  app.querySelectorAll('.cell.pc').forEach(e=>e.onclick=()=>{const p=+e.dataset.p;s.sel=s.sel===p?null:p;draw()});
  app.querySelectorAll('.slot.hot').forEach(e=>e.onclick=()=>{const i=+e.dataset.i;if(s.sel===null)return;
   if(s.sel===i){s.placed.add(i);s.sel=null;bell(1568,0);confetti(18,50);if(s.placed.size==12)win();else draw()}
   else{tone(150,0,.2,'sawtooth',.12);e.classList.remove('no');void e.offsetWidth;e.classList.add('no')}})}
}
const COL=['#e74c3c','#f0c24b','#3cc46a','#4aa3e8','#fff'];
function confetti(n,y){const fx=$('#fx');for(let i=0;i<n;i++){const e=document.createElement('i');e.style.cssText=`left:${20+Math.random()*60}%;top:${y}%;background:${COL[Math.random()*5|0]};--dx:${Math.random()*700-350}px;--dy:${-80-Math.random()*320}px;--r:${Math.random()*720}deg;animation-delay:${Math.random()*.25}s`;fx.appendChild(e);setTimeout(()=>e.remove(),2800)}}
function flash(c){const e=document.createElement('div');e.className='flash';e.style.background=`radial-gradient(circle,${c},transparent 70%)`;$('#fx').appendChild(e);setTimeout(()=>e.remove(),800)}
function firework(){const fx=$('#fx'),x=15+Math.random()*70,y=15+Math.random()*40,c=COL[Math.random()*5|0];for(let i=0;i<28;i++){const a=i/28*6.283,d=70+Math.random()*90,e=document.createElement('i');e.className='p';e.style.cssText=`left:${x}%;top:${y}%;color:${c};background:${c};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px`;fx.appendChild(e);setTimeout(()=>e.remove(),1300)}if(!mute&&ac){tone(160+Math.random()*80,0,.25,'sine',.15);bell(1500+Math.random()*1000,.1)}}
function finale(){for(let i=0;i<10;i++)setTimeout(firework,i*400);confetti(140,20)}
function noise(d,f0,f1,ty,v){if(mute||!ac)return;const n=ac.sampleRate*d|0,b=ac.createBuffer(1,n,ac.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain(),T=ac.currentTime;s.buffer=b;f.type=ty;f.frequency.setValueAtTime(f0,T);f.frequency.exponentialRampToValueAtTime(f1,T+d);g.gain.setValueAtTime(.0001,T);g.gain.linearRampToValueAtTime(v,T+d*.4);g.gain.exponentialRampToValueAtTime(.001,T+d);s.connect(f);f.connect(g);g.connect(ac.destination);s.start(T)}
function shape(){const n=32,p=[];for(let i=0;i<n;i++){const a=i/n*6.283,r=(i%2?30:44)+Math.random()*12;p.push(`${50+Math.cos(a)*r}% ${50+Math.sin(a)*r}%`)}return`polygon(${p.join(',')})`}
function snow(s,x,y){const e=document.createElement('div');e.style.cssText=`position:absolute;left:${x}px;top:${y}px;width:${s}px;height:${s}px;margin:${-s/2}px;clip-path:${shape()};background:radial-gradient(circle at 38% 32%,#fff 0,#f2f7fc 45%,#cddcec 80%,#a9bfd8 100%);backdrop-filter:blur(3px)`;return e}
function flake(x,y){const e=document.createElement('i'),s=2+Math.random()*4;e.style.cssText=`left:${x}px;top:${y}px;width:${s}px;height:${s}px;border-radius:50%;background:#fff;animation:none`;$('#fx').appendChild(e);e.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${Math.random()*40-20}px,${30+Math.random()*50}px)`,opacity:0}],{duration:650}).onfinish=()=>e.remove()}
function bang(){tone(55,0,.6,'sine',.9);noise(.4,2500,100,'lowpass',1);for(let i=0;i<14;i++)setTimeout(()=>noise(.05,5000+Math.random()*3000,2500,'bandpass',.5),Math.random()*260);for(let i=0;i<6;i++)tone(2200+Math.random()*2500,Math.random()*.3,.25,'sine',.06)}
function cracks(cx,cy){const W=innerWidth,H=innerHeight,R=Math.hypot(W,H),n=13,cr=[],P=[],J=()=>Math.random()-.5;
